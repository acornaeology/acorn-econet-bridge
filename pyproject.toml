[project]
name = "acorn-econet-bridge"
version = "0.1.0"
description = "Annotated disassemblies of Acorn Econet Bridge ROMs"
license = "MIT"
authors = [
    { name = "Robert Smallshire" },
]
requires-python = ">=3.12"
dependencies = [
    "fantasm>=0.17.1",
    "dasmos>=2.0.1",
]

[dependency-groups]
dev = [
    "pre-commit>=3.0",
]

[tool.uv]
index-url = "https://pypi.org/simple"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# This repo is annotated-disassembly content, not a published library.
# Build the versions/ tree as the wheel payload so 'uv sync' has
# something to install.
only-include = ["versions"]
