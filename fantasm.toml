# fantasm project configuration. See docs/configuration.md for the schema.

[project]
name = "acorn-econet-bridge"

[rom]
# Default CPU for opcode decoding: "6502" (NMOS) or "65c02" (CMOS).
cpu = "6502"
# The Econet Bridge ROM is mapped at &E000-&FFFF on its own 6502.
base_address = 0xE000

[versions]
prefixes = ["econet-bridge"]
# Project-specific driver-filename template: the prefix has a hyphen
# but the driver-script identifier replaces it with an underscore.
driver_filename = "disasm_econet_bridge_{version_id_no_dots}.py"

# Single-version graph: a [[versions.entry]] is needed for `fantasm
# audit` and friends to use the version-graph's effective regions
# (mostly empty here — the driver declares everything via
# external_label() calls that fantasm lint reads from the JSON).
[[versions.entry]]
id = "variant_1"
